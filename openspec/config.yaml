schema: spec-driven

# Project context (optional) — used when generating OpenSpec artifacts for AI/agents.
context: |
  Monorepo: Nx with NestJS 11 (apps/api) and React 18 (apps/web).
  Business domain: browse files/folders from a user-supplied path under an allowed root.
  Implementation is spec-driven (OpenSpec): do not implement behavior outside approved specs/tasks.
  Paths must be handled in a cross-platform way (Windows and macOS/Linux) using Node path APIs and clear normalization rules.
  Workflow (proposal → apply on feature branch from trunk → work → archive → commit with good message): see AGENTS.md.
  Coding rules: vertical slices only. React: one folder per feature, presentational UI + services/hooks. NestJS: one folder per feature (module, controller, service, DTOs). Full rules in AGENTS.md.

